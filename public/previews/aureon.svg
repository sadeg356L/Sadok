<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Illustrated preview of the AUREON electronics store interface">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a12"/>
      <stop offset="0.5" stop-color="#0a0710"/>
      <stop offset="1" stop-color="#16091a"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.78" cy="0.24" r="0.78">
      <stop offset="0" stop-color="#ff9ad5" stop-opacity="0.3"/>
      <stop offset="0.62" stop-color="#a970ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#a970ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6fd"/>
      <stop offset="0.35" stop-color="#ffd6f1"/>
      <stop offset="0.66" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#4a2f7a"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <filter id="soft3"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg3)"/>
  <rect width="1200" height="900" fill="url(#glow3)"/>
  <rect x="44" y="40" width="1112" height="820" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- nav -->
  <text x="92" y="94" font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="9" fill="#fdf2fb">AUREON</text>
  <g font-family="Space Grotesk, Arial, sans-serif" font-size="11" letter-spacing="2.2" fill="#b3a4b8">
    <text x="618" y="93">SHOP</text>
    <text x="690" y="93">AUDIO</text>
    <text x="766" y="93">VISUAL</text>
    <text x="852" y="93">SMART HOME</text>
    <text x="1028" y="93">BAG (0)</text>
  </g>
  <line x1="92" y1="120" x2="1108" y2="120" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- headline -->
  <text x="92" y="218" font-family="Space Grotesk, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#ff9ad5">PREMIUM ELECTRONICS</text>
  <text x="92" y="312" font-family="Space Grotesk, Arial, sans-serif" font-size="64" font-weight="700" fill="#fdf3fb">DESIGNED</text>
  <text x="92" y="380" font-family="Space Grotesk, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#chrome)">TO BE FELT.</text>
  <text x="92" y="428" font-family="Space Grotesk, Arial, sans-serif" font-size="14" fill="#b3a4b8">Interactive 3D product previews · Curated catalogue · Local pricing</text>

  <rect x="92" y="468" width="184" height="50" rx="25" fill="#ff9ad5"/>
  <text x="184" y="499" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="12" font-weight="600" fill="#180a14">EXPLORE SHOP</text>
  <rect x="292" y="468" width="160" height="50" rx="25" fill="none" stroke="#ff9ad5" stroke-opacity="0.38"/>
  <text x="372" y="499" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="12" fill="#f4e3ef">VIEW IN 3D</text>

  <!-- product stage -->
  <ellipse cx="868" cy="612" rx="220" ry="34" fill="#a970ff" opacity="0.28" filter="url(#soft3)"/>
  <circle cx="868" cy="372" r="218" fill="none" stroke="#ff9ad5" stroke-opacity="0.16"/>
  <circle cx="868" cy="372" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-dasharray="2 9"/>

  <!-- headphones -->
  <g transform="translate(868 366)">
    <path d="M-104 26 C -104 -78, -40 -128, 0 -128 C 40 -128, 104 -78, 104 26" fill="none" stroke="url(#chrome)" stroke-width="16" stroke-linecap="round"/>
    <rect x="-134" y="8" width="62" height="112" rx="26" fill="url(#chrome)"/>
    <rect x="72" y="8" width="62" height="112" rx="26" fill="url(#chrome)"/>
    <rect x="-122" y="24" width="38" height="80" rx="18" fill="#2a1730" opacity="0.72"/>
    <rect x="84" y="24" width="38" height="80" rx="18" fill="#2a1730" opacity="0.72"/>
    <circle cx="-103" cy="64" r="9" fill="#ff9ad5" opacity="0.55"/>
    <circle cx="103" cy="64" r="9" fill="#ff9ad5" opacity="0.55"/>
  </g>

  <!-- rotation control -->
  <g transform="translate(1080 640) rotate(12)">
    <rect x="-74" y="-20" width="148" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="0" y="4" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="10" letter-spacing="1.6" fill="#e8d9ea">DRAG TO ROTATE</text>
  </g>

  <!-- product cards -->
  <g>
    <rect x="92" y="588" width="300" height="234" rx="18" fill="url(#card3)" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="116" y="612" width="112" height="112" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="172" cy="668" r="30" fill="none" stroke="#ff9ad5" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="172" cy="668" r="11" fill="#ff9ad5" fill-opacity="0.35"/>
    <text x="248" y="640" font-family="Space Grotesk, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#fdf2fb">AUDIO</text>
    <text x="248" y="662" font-family="Space Grotesk, Arial, sans-serif" font-size="11" fill="#b3a4b8">Headphones</text>
    <rect x="116" y="744" width="66" height="1" fill="#ff9ad5" fill-opacity="0.6"/>
    <text x="116" y="778" font-family="Space Grotesk, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b3a4b8">BEST SELLER</text>
  </g>

  <g>
    <rect x="412" y="588" width="300" height="234" rx="18" fill="url(#card3)" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="436" y="612" width="112" height="112" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="466" y="642" width="52" height="34" rx="4" fill="none" stroke="#b98cff" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="492" cy="659" r="8" fill="#b98cff" fill-opacity="0.5"/>
    <text x="568" y="640" font-family="Space Grotesk, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#fdf2fb">VISUAL</text>
    <text x="568" y="662" font-family="Space Grotesk, Arial, sans-serif" font-size="11" fill="#b3a4b8">Cameras</text>
    <rect x="436" y="744" width="66" height="1" fill="#b98cff" fill-opacity="0.6"/>
    <text x="436" y="778" font-family="Space Grotesk, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b3a4b8">NEW ARRIVAL</text>
  </g>

  <g>
    <rect x="732" y="588" width="376" height="234" rx="18" fill="url(#card3)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="760" y="628" font-family="Space Grotesk, Arial, sans-serif" font-size="10" letter-spacing="2.4" fill="#ff9ad5">3D PRODUCT VIEWER</text>
    <text x="760" y="660" font-family="Space Grotesk, Arial, sans-serif" font-size="17" fill="#fdf2fb">Orbit · Zoom · Inspect</text>
    <line x1="760" y1="682" x2="1080" y2="682" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="Space Grotesk, Arial, sans-serif" font-size="11" fill="#b3a4b8">
      <text x="760" y="712">TypeScript</text>
      <text x="760" y="736">Three.js</text>
      <text x="760" y="760">E-commerce UI</text>
    </g>
    <circle cx="1050" cy="724" r="26" fill="none" stroke="#ff9ad5" stroke-opacity="0.5"/>
    <path d="M1038 724 l 8 8 l 16 -18" fill="none" stroke="#ff9ad5" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1108" y="840" text-anchor="end" font-family="Space Grotesk, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#ffffff" fill-opacity="0.28">ILLUSTRATIVE PREVIEW</text>
</svg>
