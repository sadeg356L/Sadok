<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Illustrated preview of the KHOTWA sneaker store interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150c26"/>
      <stop offset="0.55" stop-color="#0a0714"/>
      <stop offset="1" stop-color="#120a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#b98cff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#7c4dff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ddff"/>
      <stop offset="0.55" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#6b3fd4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- frame -->
  <rect x="44" y="40" width="1112" height="820" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- top bar -->
  <text x="92" y="92" font-family="Space Grotesk, Arial, sans-serif" font-size="19" letter-spacing="6" fill="#efe6ff">KHOTWA</text>
  <g font-family="Space Grotesk, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#a79fb6">
    <text x="720" y="91">SHOP</text>
    <text x="800" y="91">SIZE GUIDE</text>
    <text x="930" y="91">CART (0)</text>
  </g>
  <line x1="92" y1="120" x2="1108" y2="120" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- hero text -->
  <text x="92" y="272" font-family="Space Grotesk, Arial, sans-serif" font-size="72" font-weight="700" fill="#f6f1ff">STEP INTO</text>
  <text x="92" y="348" font-family="Space Grotesk, Arial, sans-serif" font-size="72" font-weight="700" fill="#b98cff">THREE DIMENSIONS</text>
  <text x="92" y="396" font-family="IBM Plex Sans Arabic, Segoe UI, sans-serif" font-size="17" fill="#b7addc">عارض حذاء تفاعلي · دليل مقاسات · طلب عبر واتساب</text>

  <rect x="92" y="436" width="196" height="52" rx="26" fill="#b98cff"/>
  <text x="190" y="468" text-anchor="middle" font-family="IBM Plex Sans Arabic, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0a0612">تسوّق المجموعة</text>
  <rect x="304" y="436" width="156" height="52" rx="26" fill="none" stroke="#b98cff" stroke-opacity="0.4"/>
  <text x="382" y="468" text-anchor="middle" font-family="IBM Plex Sans Arabic, Segoe UI, sans-serif" font-size="15" fill="#e8def8">دليل المقاسات</text>

  <!-- showcase disc -->
  <circle cx="850" cy="360" r="238" fill="none" stroke="#b98cff" stroke-opacity="0.18"/>
  <circle cx="850" cy="360" r="188" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-dasharray="4 10"/>
  <ellipse cx="850" cy="530" rx="210" ry="34" fill="#7c4dff" opacity="0.35" filter="url(#blur)"/>

  <!-- abstract sneaker -->
  <g transform="translate(700 300) rotate(-14)">
    <path d="M20 190 C 60 120, 150 96, 214 108 C 258 116, 282 150, 330 168 L 372 186 C 392 194, 396 214, 380 226 L 352 246 C 320 264, 60 264, 34 244 C 8 224, 6 210, 20 190 Z" fill="url(#shoe)"/>
    <path d="M46 214 C 120 236, 232 238, 330 214" stroke="#3c1a7a" stroke-opacity="0.55" stroke-width="8" fill="none"/>
    <path d="M120 126 C 150 156, 186 166, 226 162" stroke="#e6d9ff" stroke-opacity="0.75" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M158 118 C 188 148, 222 158, 258 154" stroke="#e6d9ff" stroke-opacity="0.55" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M26 236 C 70 258, 150 262, 214 258" stroke="#0a0612" stroke-opacity="0.55" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="330" cy="196" r="8" fill="#ffe6fb" opacity="0.85"/>
  </g>

  <!-- product cards -->
  <g>
    <rect x="92" y="580" width="326" height="234" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="116" y="604" width="120" height="120" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <path d="M132 674 c 14 -26, 36 -34, 52 -28 c 16 6, 24 16, 40 20 c 10 2, 12 10, 2 14 c -18 8, -60 8, -76 0 c -10 -5, -12 -8, -18 -6 z" fill="#b98cff" fill-opacity="0.8"/>
    <text x="252" y="636" font-family="Space Grotesk, Arial, sans-serif" font-size="15" fill="#efe6ff">MODEL 01</text>
    <text x="252" y="662" font-family="IBM Plex Sans Arabic, Segoe UI, sans-serif" font-size="12" fill="#a79fb6">أحذية رياضية</text>
    <rect x="252" y="682" width="52" height="1" fill="#b98cff" fill-opacity="0.6"/>
    <text x="116" y="766" font-family="Space Grotesk, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8fd9c0">3D VIEWER READY</text>
  </g>

  <g>
    <rect x="440" y="580" width="326" height="234" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="464" y="604" width="120" height="120" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="524" cy="664" r="34" fill="none" stroke="#8fb8ff" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M524 630 v 68 M490 664 h 68" stroke="#8fb8ff" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="600" y="636" font-family="Space Grotesk, Arial, sans-serif" font-size="15" fill="#efe6ff">SIZE GUIDE</text>
    <text x="600" y="662" font-family="IBM Plex Sans Arabic, Segoe UI, sans-serif" font-size="12" fill="#a79fb6">جدول المقاسات</text>
    <rect x="600" y="682" width="52" height="1" fill="#8fb8ff" fill-opacity="0.6"/>
    <text x="464" y="766" font-family="Space Grotesk, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8fb8ff" fill-opacity="0.8">RESPONSIVE LAYOUT</text>
  </g>

  <g>
    <rect x="788" y="580" width="320" height="234" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="812" y="604" width="120" height="120" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <path d="M842 664 l 18 18 l 34 -40" fill="none" stroke="#c2ffd9" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="948" y="636" font-family="Space Grotesk, Arial, sans-serif" font-size="15" fill="#efe6ff">ORDER</text>
    <text x="948" y="662" font-family="IBM Plex Sans Arabic, Segoe UI, sans-serif" font-size="12" fill="#a79fb6">طلب عبر واتساب</text>
    <rect x="948" y="682" width="52" height="1" fill="#c2ffd9" fill-opacity="0.6"/>
    <text x="812" y="766" font-family="Space Grotesk, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#c2ffd9" fill-opacity="0.7">NO CHECKOUT FRICTION</text>
  </g>

  <text x="1108" y="840" text-anchor="end" font-family="Space Grotesk, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#ffffff" fill-opacity="0.28">ILLUSTRATIVE PREVIEW</text>
</svg>
